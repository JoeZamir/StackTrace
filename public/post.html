<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>stackTrace</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/feed.css" />
  <link rel="stylesheet" href="css/post.css" />
</head>
<body>
  <div class="site-shell">
    <nav class="site-nav" data-nav aria-label="Primary">
      <a class="site-nav__brand" href="index.html"><span class="site-nav__brand-glyph">//</span>stackTrace</a>
      <div class="site-nav__links">
        <a href="index.html">Feed</a>
        <a href="new-post.html">New post</a>
      </div>
      <a class="site-nav__cta" href="new-post.html">+ New post</a>
      <p class="site-nav__footer">stackTrace — a small community for people building things with Node.</p>
    </nav>

    <main class="site-main">
      <header class="top-navbar" aria-label="Top navigation">
        <div class="top-navbar__center"></div>
        <div class="site-nav__auth top-navbar__account" data-auth-status aria-live="polite"></div>
      </header>

      <button class="nav-toggle" data-nav-toggle type="button" aria-expanded="false" aria-controls="site-nav">
        <span class="nav-toggle__bars"><span></span><span></span><span></span></span>
        <span>Menu</span>
      </button>

      <div class="content-col">
        <article class="post" data-post-id="" data-author-name="">
          <div class="post__content">
            <h1 class="post__title"></h1>
            <div class="post__meta"></div>
            <div class="post__body"></div>
            <div class="post-card__footer post__footer">
              <div class="post-card__vote-row" data-vote-row data-post-vote>
                <button class="post-card__vote" type="button" data-vote-button="up" aria-label="Upvote" aria-pressed="false"><span aria-hidden="true">▲</span><span class="post-card__vote-count" data-upvote-count>0</span></button>
                <button class="post-card__vote" type="button" data-vote-button="down" aria-label="Downvote" aria-pressed="false"><span aria-hidden="true">▼</span><span class="post-card__vote-count" data-downvote-count>0</span></button>
              </div>
              <div class="post__actions" data-post-actions>
                <a class="btn" data-edit-post href="new-post.html">Edit</a>
                <button class="btn btn--danger" type="button" data-delete-post>Delete</button>
              </div>
            </div>
            <div class="auth-form__feedback" data-post-warning hidden></div>
          </div>
        </article>

        <section class="comments" aria-label="Comments">
          <div class="comments__header"><h2>Discussion</h2><span class="comments__count">0 comments</span></div>
          <form class="comment-form" data-comment-form>
            <div class="byline__avatar" aria-hidden="true">YOU</div>
            <div class="comment-form__field">
              <textarea data-autogrow data-comment-input rows="2" placeholder="Say something useful…" maxlength="500"></textarea>
              <div class="comment-form__footer"><span class="hint" data-comment-counter>0 / 500</span><button class="btn btn--primary" type="submit">Comment</button></div>
              <div class="auth-form__feedback" data-comment-warning hidden></div>
            </div>
          </form>
          <ol class="comment-list"></ol>
        </section>
      </div>
    </main>
  </div>
  <script type="module" src="js/post.js"></script>
</body>
</html>
