<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login / Sign up — devfeed</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/form.css" />
</head>
<body>
  <div class="site-shell">
    <nav class="site-nav" data-nav aria-label="Primary">
      <div class="site-nav__top">
        <a class="site-nav__brand" href="index.html"><span class="site-nav__brand-glyph">//</span>devfeed</a>
      </div>

      <div class="site-nav__section">
        <div class="site-nav__links">
          <a href="index.html">Feed</a>
          <a href="index.html?filter=popular">Popular</a>
          <a href="news.html">News</a>
        </div>
        <a class="site-nav__cta" href="new-post.html">+ Create post</a>
      </div>

      <div class="site-nav__section">
        <span class="site-nav__section-title">Topics</span>
        <div class="sidebar-topic-list" data-topic-list aria-label="Popular topics"></div>
      </div>

      <p class="site-nav__footer">devfeed — a small community for people building things with Node.</p>
    </nav>

    <main class="site-main">
      <header class="top-navbar" aria-label="Top navigation">
        <div class="top-navbar__center"></div>
        <div class="site-nav__auth top-navbar__account" data-auth-status aria-live="polite"></div>
      </header>

      <button class="nav-toggle" data-nav-toggle type="button" aria-expanded="false" aria-controls="site-nav">
        <span class="nav-toggle__bars"><span></span><span></span><span></span></span>
        <span>Menu</span>
      </button>

      <div class="content-col">
        <header class="page-heading">
          <span class="page-heading__eyebrow">$ auth --devfeed</span>
          <h1 class="page-heading__title">Join the community</h1>
        </header>

        <form class="post-form auth-form" data-auth-form>
          <div class="field auth-form__mode-toggle" data-auth-mode-toggle>
            <button type="button" class="auth-tab is-active" data-auth-tab="login">Login</button>
            <button type="button" class="auth-tab" data-auth-tab="signup">Sign up</button>
          </div>

          <div class="field auth-field auth-field--signup" data-signup-name>
            <label class="field__label" for="full-name">Full name</label>
            <input type="text" id="full-name" name="fullName" placeholder="Ada Lovelace" />
          </div>

          <div class="field auth-field auth-field--signup" data-signup-email>
            <label class="field__label" for="signup-email">Email</label>
            <input type="text" id="signup-email" name="email" placeholder="ada@example.com" />
          </div>

          <div class="field auth-field auth-field--signup" data-signup-username>
            <label class="field__label" for="signup-username">Username</label>
            <input type="text" id="signup-username" name="username" placeholder="ada_codes" />
          </div>

          <div class="field auth-field" data-login-identity>
            <label class="field__label" for="login-identity">Email or username</label>
            <input type="text" id="login-identity" name="identity" placeholder="ada@example.com or ada_codes" required />
          </div>

          <div class="field">
            <label class="field__label" for="auth-password">Password</label>
            <input type="password" id="auth-password" name="password" placeholder="••••••••" required />
          </div>

          <div class="auth-form__feedback" data-auth-feedback aria-live="polite"></div>

          <div class="post-form__actions">
            <a class="btn" href="index.html">Cancel</a>
            <button class="btn btn--primary" type="submit" data-auth-submit>Login</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
