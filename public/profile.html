<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit profile — stackTrace</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/form.css" />
</head>
<body>
  <div class="site-shell">
    <nav class="site-nav" data-nav aria-label="Primary">
      <a class="site-nav__brand" href="index.html"><span class="site-nav__brand-glyph">//</span>stackTrace</a>
      <div class="site-nav__links"><a href="index.html">Feed</a><a href="new-post.html">New post</a><a href="news.html">News</a></div>
      <a class="site-nav__cta" href="new-post.html">+ New post</a>
      <p class="site-nav__footer">stackTrace — a small community for people building things with Node.</p>
    </nav>
    <main class="site-main">
      <header class="top-navbar" aria-label="Top navigation"><div class="top-navbar__center"></div><div class="site-nav__auth top-navbar__account" data-auth-status aria-live="polite"></div></header>
      <button class="nav-toggle" data-nav-toggle type="button" aria-expanded="false" aria-controls="site-nav"><span class="nav-toggle__bars"><span></span><span></span><span></span></span><span>Menu</span></button>
      <div class="content-col">
        <header class="page-heading"><span class="page-heading__eyebrow">$ stackTrace profile</span><h1 class="page-heading__title">Edit your profile</h1></header>
        <form class="post-form auth-form" data-profile-form>
          <div class="field"><label class="field__label" for="profile-full-name">Full name</label><input id="profile-full-name" name="fullName" type="text" required /></div>
          <div class="field"><label class="field__label" for="profile-email">Email</label><input id="profile-email" name="email" type="email" required /></div>
          <div class="field"><label class="field__label" for="profile-username">Username</label><input id="profile-username" name="username" type="text" required /></div>
          <div class="auth-form__feedback" data-profile-feedback aria-live="polite"></div>
          <div class="post-form__actions"><a class="btn" href="index.html">Cancel</a><button class="btn btn--primary" type="submit">Save profile</button></div>
        </form>
      </div>
    </main>
  </div>
  <script type="module" src="js/profile.js"></script>
</body>
</html>
